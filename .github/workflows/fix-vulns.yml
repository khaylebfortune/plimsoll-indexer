name: fix-vulns

# Runs once on each push to this branch; commits the upgraded go.mod/go.sum
# back so govulncheck sees patched versions. The [skip-fix-vulns] guard in the
# commit message prevents the workflow from re-triggering on its own commit.
on:
  push:
    branches: [fix/issues-49-50-51-52]

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip-fix-vulns]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tidy module graph
        run: go mod tidy
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): go mod tidy [skip-fix-vulns]"
            git push
          fi
