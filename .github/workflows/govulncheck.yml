name: govulncheck

on:
  pull_request:
  schedule:
    # Run every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
